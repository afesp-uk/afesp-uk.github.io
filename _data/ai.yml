news:
  - date: 2026-11-23
    title: AIM for Scale and partners expand AI weather forecasting training to strengthen national weather services for farmers
    source: WMO
    summary: Officials from 15 countries spent a week in Abu Dhabi learning to test, run and adopt advanced AI weather models for forecasts aimed at small-scale farmers. The programme, up from six countries in 2025, aims to reach 30 nations by 2027, with each delegation leaving with a basic working agricultural weather service.
    url: https://wmo.int/media/project-update/aim-scale-and-partners-expand-ai-weather-forecasting-training-strengthen-national-weather-services

  - date: 2026-11-20
    title: New approach enables physically consistent AI models of chaotic systems
    source: MIT News
    summary: Sunbochen Tang, Navid Azizan and Themistoklis Sapsis (PNAS) add a learned energy-like function and enforce energy dissipation as a hard constraint, keeping AI models of weather, climate and turbulence within realistic bounds over long runs without suppressing their chaotic behaviour.
    url: https://news.mit.edu/new-approach-enables-physically-consistent-ai-models-chaotic-systems-1120

  - date: 2026-11-19
    title: Forecast-in-a-Box – piloting a portable solution for running AI weather forecasts
    source: ECMWF
    summary: ECMWF, MET Norway and Malawi's DCCMS are testing Forecast-in-a-Box, which lets national weather services produce AI forecasts on their own local infrastructure. The Malawi pilot uses a variant of MET Norway's Bris model tuned for Africa to improve early warnings for droughts, floods and cyclones, with more African countries and Destination Earth users to follow in 2027.
    url: https://www.ecmwf.int/en/about/media-centre/news/2026/forecast-box-piloting-portable-solution-running-ai-weather-forecasts

  - date: 2026-11-16
    title: ECMWF wins two 2026 HPCwire awards
    source: EurekAlert! / ECMWF
    summary: ECMWF received "Best Use of HPC/AI in Physical Sciences" for building AI weather models with its open-source Anemoi framework on EuroHPC supercomputers, and "Best Use of HPC/AI in Response to Societal Plight" for Forecast-in-a-Box, which brings AI forecasting to countries with limited computing resources.
    url: https://www.eurekalert.org/news-releases/1152244

  - date: 2026-11-13
    title: "COP31: New initiative targets AI and reliable climate change information"
    source: UN News
    summary: The Global Initiative for Information Integrity on Climate Change, led by the UN, UNESCO and Brazil, launched guidance at COP31 to help people get trustworthy climate information from AI. It asks AI companies to assess their effects on climate information and disclose their energy use and environmental footprints, and urges governments to build information integrity into their AI and climate plans.
    url: https://news.un.org/en/story/2026/11/1168798

  - date: 2026-11-12
    title: "Exploring future forecasting: how the Met Office is supporting AI innovation"
    source: Met Office
    summary: The Met Office has signed a multi-year agreement with Google to assess its WeatherNext 3 AI model in experimental sandboxes, building on earlier tropical cyclone work and the FastNet model developed with The Alan Turing Institute. AI is presented as a complement to physics-based forecasting, with new techniques validated before operational use and meteorologists still interpreting the data and issuing warnings.
    url: https://www.metoffice.gov.uk/blog/2026/exploring-future-forecasting-how-the-met-office-is-supporting-ai-innovation

  - date: 2026-10-28
    title: AI for Science expands to foundations and research institutions
    source: Anthropic
    summary: Anthropic's AI for Science programme, which gives free Claude credits to researchers on high-impact scientific projects, now works with 20 foundations, institutions and research groups worldwide, including Schmidt Sciences and the US National Science Foundation. Among them is LEAP at Columbia University, which combines machine learning and physics to improve Earth system and climate models.
    url: https://www.anthropic.com/news/ai-for-science-expands-foundations-research-institutions

  - date: 2026-09-03
    title: Google DeepMind introduces WeatherNext 3
    source: Google
    summary: Google DeepMind and Google Research's newest global AI weather model learns directly from live geostationary satellite data, not only from supercomputer simulations, and produces hourly forecasts at up to 5 km resolution.
    url: https://blog.google/innovation-and-ai/models-and-research/google-deepmind/introducing-weathernext-3/

  - date: 2026-10-16
    title: ECMWF introduces AIFS-COMPO, a new AI system for atmospheric composition forecasting
    source: ECMWF
    summary: An experimental AI model adapted from the AIFS to forecast global aerosols and reactive gases, with a 10-day range beyond the five-day outlook of the operational CAMS system. Initial tests show it matches or beats the operational IFS-COMPO on several key species at a much lower computational cost, though it still lacks features such as time-varying emissions.
    url: https://www.ecmwf.int/en/about/media-centre/news/2026/aifs-compo-ai-atmospheric-composition-forecasting

  - date: 2026-10-14
    title: Machine learning improves weather forecasts two to six weeks ahead
    source: MIT News
    summary: Judah Cohen, Lester Mackey and colleagues built a Probabilistic Bias Correction model, a machine-learning layer on top of existing forecasting systems that improves subseasonal forecasts. Published in Nature.
    url: https://news.mit.edu/2026/researchers-improve-weather-forecasts-looking-two-six-weeks-out-1014

  - date: 2026-10-14
    title: UC San Diego awarded $2.35 million from Google.org for AI-driven climate modelling
    source: UC San Diego
    summary: Duncan Watson-Parris and colleagues will use AI to improve climate models and guide new ocean observations, including adapted Argo floats, through the AI for Science Impact Challenge.
    url: https://today.ucsd.edu/story/uc-san-diego-awarded-2.35-million-from-google-to-advance-ai-driven-climate-modeling

  - date: 2026-09-24
    title: AI dominates the conversation at Climate Week NYC
    source: MIT Technology Review
    summary: AI, both as a climate tool and as a growing source of energy demand, was the main theme of this year's Climate Week in New York.
    url: https://www.technologyreview.com/2026/09/24/1145048/ai-climate-week/

  - date: 2026-08-11
    title: Droughts unlikely to ease soon, AI models show
    source: University of Reading
    summary: AFESP PhD researcher Karan Ruparell, who builds AI river-flow forecasting models, comments on England's drought outlook.
    url: https://www.reading.ac.uk/news/2026/Expert-Comment/Droughts-unlikely-to-ease-soon-AI-models-show-expert-comments
    afesp: true

  - date: 2026-07-08
    title: AI can produce trustworthy, physically realistic weather forecasts
    source: Met Office
    summary: The Met Office and the Alan Turing Institute's FastNet model, trained with physical principles, now performs comparably to the Met Office Global Model and better captures extreme storms.
    url: https://www.metoffice.gov.uk/about-us/news-and-media/media-centre/weather-and-climate-news/2026/new-research-shows-ai-can-produce-trustworthy-physically-realistic-weather-forecasts-

  - date: 2026-05-12
    title: ECMWF's AIFS v2 goes live
    source: ECMWF
    summary: The machine-learned AIFS Single and Ensemble move to version 2, adding a wave component and ECMWF's first data-driven snow cover forecasts.
    url: https://www.ecmwf.int/en/about/media-centre/news/2026/ifs-cycle-50r1-aifsv2-live

# links: the "Useful links" section of the AI page, shown in this order.
links:
  - title: Responsible AI Risk Register
    url: https://jshng-glasgow.github.io/Responsible-AI-Risk-Register/
    summary: A community-maintained register of risks, and resources for managing them, when using AI in research software engineering.

  - title: GenAI in Teaching, Learning & Assessment
    url: https://www.reading.ac.uk/cqsd/artificial-intelligence
    summary: The University of Reading's hub for generative AI in education, with its policy position, guidance for staff and students, and a community of practice.

  - title: AI Policy — Simulation Systems documentation
    url: https://metoffice.github.io/simulation-systems/FurtherDetails/ai.html
    summary: The Met Office rules for contributing code written with generative AI tools to its simulation systems, including guardrails and how to attribute AI use.

  - title: "Hidden Figures, Hidden Costs: Reducing the Footprint of Your AI Use"
    url: https://www.software.ac.uk/blog/hidden-figures-hidden-costs-reducing-footprint-your-ai-use
    summary: An Institute for Research Software blog post by Kirsty Pringle (17 November 2026) on the hidden environmental costs of AI in research, with practical ways to cut them, from choosing smaller models, focused prompts and fresh threads to reusing pre-trained models, piloting on small samples, and measuring and reporting your footprint.

  - title: "Choosing to work without AI (University of Reading Library guide)"
    url: https://libguides.reading.ac.uk/work_without_ai/home
    summary: A University of Reading Library guide for students who want or need to limit their use of generative AI in some or all of their research and study. It explains what AI is and how chatbots work, and covers recognising AI, searching for information, referencing, and switching off AI tools.
