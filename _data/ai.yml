# Entries for the AI page (_pages/ai.md).
#
# events: workshops, conferences and webinars on AI / machine learning in weather and climate science.
#   - start and end are YYYY-MM-DD (end can be left out for a one-day event).
#   - The page sorts them by date and moves an event from "Upcoming" to "Recent" by itself once it has finished.
#   - kind is one of: Workshop, Conference, Webinar, Seminar
#   - afesp: true lists the event under "AFESP conferences and workshops" at the top of the page (green border and an AFESP badge);
#     once it has finished it moves to "Past AFESP conferences and workshops", grouped by year.
#   - past: true moves an AFESP event into that archive straight away, before its last day has ended.
#   - url can be an external link or a page on this site (e.g. /about/); leave it out for a card with no link.
# news: short news items, newest first is not required (the page sorts them by date).

events:
  - title: AFESP Conference 2026
    organiser: AFESP, with ECMWF, the Met Office and NCAS
    kind: Conference
    start: 2026-11-02
    end: 2026-11-03
    location: Henley Business School, Whiteknights Campus, University of Reading, RG6 6UD
    summary: Bringing together everyone in the AFESP programme, with keynote presenters, short talks from AFESP investigators and research scientists, PhD student poster sessions, and breakout sessions to shape future AFESP priorities.
    afesp: true
    past: true

  - title: AFESP Conference 2025
    organiser: AFESP, with ECMWF, the Met Office and NCAS
    kind: Conference
    start: 2025-11-04
    location: Meadow Suite, Whiteknights Campus, University of Reading, RG6 6UR
    summary: The AFESP programme's 2025 conference.
    afesp: true

  - title: "Training course: Machine Learning-based weather forecasting"
    organiser: ECMWF
    kind: Workshop
    start: 2026-11-16
    end: 2026-11-20
    location: ECMWF, Reading, UK (in person)
    summary: An advanced training course on deep learning for Earth system forecasting and the Anemoi framework, with lectures and hands-on coding. Applications closed on 28 June.
    url: https://events.ecmwf.int/event/546/registrations/

  - title: Workshop on software strategies for sustainable physical modelling
    organiser: ECMWF
    kind: Workshop
    start: 2026-11-23
    end: 2026-11-27
    location: venue to be confirmed
    summary: Shared code, automated testing and open-source practice for Earth system models, including how to integrate machine learning components.
    url: https://www.ecmwf.int/en/about/media-centre/news/2025/ecmwf-2026-events-programme

  - title: AGU26 Annual Meeting
    organiser: American Geophysical Union
    kind: Conference
    start: 2026-12-07
    end: 2026-12-11
    location: San Francisco, CA, USA
    summary: The largest Earth and space science meeting of the year, with many sessions on AI and machine learning for weather, climate and the Earth system.
    url: https://www.agu.org/annual-meeting

  - title: "Tackling Climate Change with Machine Learning: Fostering Ground-Up Innovation in AI and Climate"
    organiser: Climate Change AI at NeurIPS 2026
    kind: Workshop
    start: 2026-12-11
    location: Sydney, Australia
    summary: How machine learning can support climate change mitigation, adaptation and climate science. Part of NeurIPS 2026 (6–12 December).
    url: https://www.climatechange.ai/events/neurips2026

  - title: 26th Conference on Artificial Intelligence for Environmental Science
    organiser: 107th AMS Annual Meeting
    kind: Conference
    start: 2027-01-10
    end: 2027-01-14
    location: Denver, CO, USA
    summary: AI for weather prediction, climate and subseasonal forecasting, satellite and radar data, data assimilation, disaster response and large language models in the weather sector.
    url: https://annual.ametsoc.org/2027/program-events/conferences-and-symposia/26th-conference-on-artificial-intelligence-for-environmental-science/

  - title: 7th WGNE Workshop on Systematic Errors in Weather and Earth System Models
    organiser: WCRP Earth System Modelling and Observations (ESMO) and WGNE
    kind: Workshop
    start: 2027-02-15
    end: 2027-02-19
    location: IITM, Pune, India
    summary: Understanding and reducing systematic errors in physics-based and machine-learning-based weather and Earth system models, including explainability and AI/ML-assisted error attribution and intercomparison of AI and physics-based model outputs. The call for abstracts has closed.
    url: https://www.wcrp-esmo.org/activities/7th-systematic-error-workshop-2027

  - title: "Data-driven climate modelling: Opportunities and challenges"
    organiser: Royal Meteorological Society, West Midlands Local Centre
    kind: Seminar
    start: 2027-02-04
    location: Royal Meteorological Society local centre meeting
    summary: A Royal Meteorological Society talk on the opportunities and challenges of data-driven (machine-learning) climate modelling.
    url: https://www.rmets.org/event/data-driven-climate-modelling-opportunities-and-challenges

  - title: How is AI Transforming Our Understanding and Prediction of Weather and Climate?
    organiser: Royal Meteorological Society
    kind: Seminar
    start: 2027-04-14
    location: Royal Meteorological Society national meeting
    summary: A Royal Meteorological Society national meeting on how AI is changing the understanding and prediction of weather and climate.
    url: https://www.rmets.org/event/how-ai-transforming-our-understanding-and-prediction-weather-and-climate

  - title: "IHP School: Artificial Intelligence for Mathematicians and Theoretical Physicists"
    organiser: Institut Henri Poincaré (IHP)
    kind: Workshop
    start: 2027-02-22
    end: 2027-02-26
    location: Institut Henri Poincaré, Paris, France
    summary: A one-week school with lectures and hands-on labs for PhD students and early-career researchers in mathematics and theoretical physics who are new to AI, covering deep learning, generative AI and LLMs, AI-assisted research and agents, formal methods, and the wider aspects and limits of AI.
    url: https://www.ihp.fr/en/events/ihp-school-artificial-intelligence-mathematicians-and-theoretical-physicists

  - title: "ELLIS Winter School 2027: AI & ML in Earth System Science"
    organiser: AI4PEX and ELIAS Horizon Europe projects and the ELLIS Unit Jena
    kind: Workshop
    start: 2027-03-01
    end: 2027-03-05
    location: Friedrich Schiller University Jena, Germany
    summary: A hands-on winter school on AI and machine learning for the land, ocean, atmosphere and biosphere, from foundation models and generative and agentic AI to trustworthy AI, with keynotes from Zhijing Jin, Tapio Schneider, Konstantin Klemmer and Peter Dueben. Fee €400; applications close 15 November 2026.
    url: https://elias-ai.eu/event/ellis-winter-school-2027-ai-ml-in-earth-system-science/

  - title: EGU General Assembly 2027
    organiser: European Geosciences Union
    kind: Conference
    start: 2027-04-04
    end: 2027-04-09
    location: Vienna, Austria and online
    summary: Europe's largest geoscience meeting, with sessions on machine learning and AI across the atmospheric, ocean, hydrology and Earth system science programmes.
    url: https://meetingorganizer.copernicus.org/EGU27/sessionprogramme/5218

news:
  - date: 2026-10-28
    title: AI for Science expands to foundations and research institutions
    source: Anthropic
    summary: Anthropic's AI for Science programme, which gives free Claude credits to researchers on high-impact scientific projects, now works with 20 foundations, institutions and research groups worldwide, including Schmidt Sciences and the US National Science Foundation. Among them is LEAP at Columbia University, which combines machine learning and physics to improve Earth system and climate models.
    url: https://www.anthropic.com/news/ai-for-science-expands-foundations-research-institutions

  - date: 2026-09-03
    title: Google DeepMind introduces WeatherNext 3
    source: Google
    summary: Google DeepMind and Google Research's newest global AI weather model learns directly from live geostationary satellite data, not only from supercomputer simulations, and produces hourly forecasts at up to 5 km resolution.
    url: https://blog.google/innovation-and-ai/models-and-research/google-deepmind/introducing-weathernext-3/

  - date: 2026-10-14
    title: Machine learning improves weather forecasts two to six weeks ahead
    source: MIT News
    summary: Judah Cohen, Lester Mackey and colleagues built a Probabilistic Bias Correction model, a machine-learning layer on top of existing forecasting systems that improves subseasonal forecasts. Published in Nature.
    url: https://news.mit.edu/2026/researchers-improve-weather-forecasts-looking-two-six-weeks-out-1014

  - date: 2026-10-14
    title: UC San Diego awarded $2.35 million from Google.org for AI-driven climate modelling
    source: UC San Diego
    summary: Duncan Watson-Parris and colleagues will use AI to improve climate models and guide new ocean observations, including adapted Argo floats, through the AI for Science Impact Challenge.
    url: https://today.ucsd.edu/story/uc-san-diego-awarded-2.35-million-from-google-to-advance-ai-driven-climate-modeling

  - date: 2026-09-24
    title: AI dominates the conversation at Climate Week NYC
    source: MIT Technology Review
    summary: AI, both as a climate tool and as a growing source of energy demand, was the main theme of this year's Climate Week in New York.
    url: https://www.technologyreview.com/2026/09/24/1145048/ai-climate-week/

  - date: 2026-08-11
    title: Droughts unlikely to ease soon, AI models show
    source: University of Reading
    summary: AFESP PhD researcher Karan Ruparell, who builds AI river-flow forecasting models, comments on England's drought outlook.
    url: https://www.reading.ac.uk/news/2026/Expert-Comment/Droughts-unlikely-to-ease-soon-AI-models-show-expert-comments
    afesp: true

  - date: 2026-07-08
    title: AI can produce trustworthy, physically realistic weather forecasts
    source: Met Office
    summary: The Met Office and the Alan Turing Institute's FastNet model, trained with physical principles, now performs comparably to the Met Office Global Model and better captures extreme storms.
    url: https://www.metoffice.gov.uk/about-us/news-and-media/media-centre/weather-and-climate-news/2026/new-research-shows-ai-can-produce-trustworthy-physically-realistic-weather-forecasts-

  - date: 2026-05-12
    title: ECMWF's AIFS v2 goes live
    source: ECMWF
    summary: The machine-learned AIFS Single and Ensemble move to version 2, adding a wave component and ECMWF's first data-driven snow cover forecasts.
    url: https://www.ecmwf.int/en/about/media-centre/news/2026/ifs-cycle-50r1-aifsv2-live

# links: the "Useful links" section of the AI page, shown in this order.
links:
  - title: Responsible AI Risk Register
    url: https://jshng-glasgow.github.io/Responsible-AI-Risk-Register/
    summary: A community-maintained register of risks, and resources for managing them, when using AI in research software engineering.

  - title: GenAI in Teaching, Learning & Assessment
    url: https://www.reading.ac.uk/cqsd/artificial-intelligence
    summary: The University of Reading's hub for generative AI in education, with its policy position, guidance for staff and students, and a community of practice.

  - title: AI Policy — Simulation Systems documentation
    url: https://metoffice.github.io/simulation-systems/FurtherDetails/ai.html
    summary: The Met Office rules for contributing code written with generative AI tools to its simulation systems, including guardrails and how to attribute AI use.
