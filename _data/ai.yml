    url: https://events.ecmwf.int/event/587/

  - title: WeatherGenerator Community Hackathon
    organiser: ECMWF and the WeatherGenerator project
    kind: Workshop
    start: 2027-01-26
    end: 2027-01-28
    location: Jena, Germany
    summary: Teams of two to five run and fine-tune the open-source WeatherGenerator model for their own applications, with a tutorial and mentor support. Free; rolling applications until places are filled.
