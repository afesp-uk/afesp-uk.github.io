- date: 2026-10-30
  title: "AdHImEx: accurate transport for long time steps on any grid"
  people:
    - name: Amber te Winkel
      anchor: amber-winkle
    - name: Hilary Weller
      anchor: hilary-weller
    - name: Christian Kühnlein (ECMWF)
    - name: James Kent (Met Office)
  project: /projects/phd_amber_te_winkle/
  image: highlights/adhimex_comparison.png
  image_alt: "Two panels show the same deformed tracer field: an explicit reference run on a uniform grid and an AdHImEx run on a nonuniform grid with an identical time step. The fields look the same, with errors (l2) of 0.2284 and 0.2264."
  caption: "With the same time step, AdHImEx on a nonuniform grid (right) matches an explicit reference on a uniform grid (left): ℓ₂ error 0.2264 against 0.2284."
  text:
    - "Weather and climate models carry moisture, heat and pollutants with the wind. With conventional explicit methods, a few small grid cells (e.g., near the poles of a latitude–longitude grid or in a nested high-resolution region) or a patch of fast flow (e.g., in strong updrafts or a mountain valley) can force short, costly time steps everywhere. Adaptively Implicit-Explicit (AdImEx) time stepping methods avoid this by blending a cheap explicit method with a robust implicit method where needed. The new high-order AdHImEx method is more accurate at long time steps than previous AdImEx methods and can reduce computing time compared with explicit methods. This frees kilometre-scale models from a strict time-step limit, regardless of the grid they use."
    - "AdHImEx was tested for vertical transport in the Met Office’s next-generation model, LFRic. It produced a weather forecast essentially identical to the one using the existing advection scheme – a promising first step towards high-order AdImEx time stepping in operational models."
  links:
    - title: "Preprint: AdHImEx: Adaptively High-Order Implicit-Explicit Transport for Large Time Steps"
      url: https://papers.ssrn.com/sol3/papers.cfm?abstract_id=7537214

- date: 2026-10-30
  title: Neural networks that emulate turbulence in the MONC cloud model
  people:
    - name: Sambit Kumar Panda
      anchor: sambit-panda
    - name: Todd R. Jones
      anchor: todd-jones
    - name: Muhammad Shahzad
    - name: Bryan N. Lawrence
      anchor: bryan-lawrence
    - name: Anna-Louise Ellis (Met Office)
  project: /projects/phd_sambit_kumar_panda/
  image: highlights/panda_monc_clouds.jpg
  image_alt: "Three rows of 3-D cloud renders over a month of simulation, one row each for MONC's original turbulence scheme and the two neural-network emulators; the cloud fields look alike in all three rows."
  caption: "Simulated clouds over a month (left to right) with MONC’s original turbulence scheme (top) and the two neural-network emulators; 64 × 64 km domain, 1 km grid."
  text:
    - "Sambit Kumar Panda develops neural-network emulators of turbulence in the Met Office NERC Cloud Model (MONC). Using physics-guided multi-task learning, the networks learn MONC’s Smagorinsky–Lilly subgrid turbulence scheme with atmospheric stability built in. This year the work was published and presented at IJCNN 2026 and PASC ’26. The emulators now run inside MONC in place of the original scheme, and the model stays stable for month-long simulations, including on grids and in warmer climates the networks never saw. His poster at the ICCS Summer School 2026 won the Best Poster award (runner-up) and he also presented his work at the km-scale Global Modelling Summit 2026 in Hamburg this year."
    - "Presented at: IJCNN 2026, Maastricht (oral); PASC 2026, Bern (oral); km-scale Global Modelling Summit 2026, Hamburg (poster); EXCLAIM 2025, ETH Zurich (poster); EGU General Assembly 2025 (oral)."
  links:
    - title: "IJCNN 2026 paper (IEEE)"
      url: https://doi.org/10.1109/IJCNN69854.2026.11728747
    - title: "PASC 2026 paper (ACM)"
      url: https://doi.org/10.1145/3815572.3815750
    - title: "Highlight slide (PDF)"
      url: /assets/pdf/panda_afesp2026_highlight_slide.pdf

- date: 2026-10-30
  title: "HiSCORE progress at the ECMWF pre-Scientific Advisory Committee meeting"
  people:
    - name: Rishabh Bhatt
      anchor: rishabh-bhatt
  project: /projects/2_project/
  image: highlights/hiscore_observation_thinning.jpg
  image_alt: "Three maps of the British Isles and north-west Europe showing observation locations as dots at three thinning resolutions: (a) N80, 125 km, 147 observations; (b) N200 diamond, 71 km, 333 observations; (c) N320, 31 km, 735 observations."
  caption: "Observations used over the British Isles when thinned to (a) 125 km (147 observations), (b) 71 km (333) and (c) 31 km (735). Observations are normally thinned to keep their errors uncorrelated; HiSCORE aims to let operational forecasting centres use many more observations by accounting for their spatial observation-error correlations."
  text:
    - "In September, Rishabh Bhatt presented the progress of the HiSCORE project to ECMWF at the pre-SAC (Scientific Advisory Committee) meeting, representing one of ECMWF's external collaborations in data assimilation. His talk highlighted the objectives achieved so far, including a recent paper in QJRMS special issue on estimating the spatial observation-error correlations in AMSU-A observations at ECMWF and the UK Met Office. Rishabh's presentation also set out a vision for representing correlated observation errors in the IFS, along with developments in the pipeline to get there. The presentation was given for the benefit of ECMWF's Director of Science and Innovation, Irina Sandu, who guides their future science strategy."
  links:
    - title: "QJRMS paper: AMSU-A observation-error correlations"
      url: https://doi.org/10.1002/qj.70238
