# Open positions shown on /open-positions/ (_pages/open_positions.md).
#
# The page sorts these entries by `advertised`, most recent first, so they can be listed here in any order.
# AFESP's own positions (afesp: true) come first in a highlighted section.
#   title:          job title, shown as the heading
#   afesp:          true for AFESP's own positions; these are highlighted at the top of the page.
#                   Everything else is listed under "Open positions elsewhere".
#   organisation:   who is hiring (leave out for AFESP's own positions)
#   advertised:     date the advert was first published, YYYY-MM-DD (used for sorting)
#   advertised_label: optional text to show instead of the exact date (e.g. when only the month is known)
#   closes:         closing date as it should read on the page
#   details:        short facts shown in the grey line under the title (salary, contract, location, ...)
#   url:            the employer's own advert
#   body:           Markdown description
#
# Only list positions that are still open. Don't add adverts that have already closed,
# and remove an entry once its closing date has passed.

- title: Urban climate, micrometeorology and boundary-layer research positions
  afesp: true
  advertised: 2026-11-03
  details: Full-time or part-time · A wide range of levels
  project:
    name: URBANE
    url: /projects/5_project/
  body: |
    Within a broad range of urban climate, micrometeorology and boundary-layer projects, we have a few positions available for people with different skill sets. Do you have experience or good skills in one or more of the following?

    1. Running (1) the UM, (2) the IFS or (3) other equivalent atmospheric models
    2. Analysing UM, IFS or other equivalent model output
    3. Analysing observations (e.g. DWL, LAS, ALC, IRT or EC sensors)
    4. Writing code and making code more efficient (Fortran or Python)
    5. Handling and processing GIS data (e.g. to create databases, model input or evaluation data)
    6. Running land surface models
    7. Analysing land surface model output (e.g. evaluation against observations)
    8. Developing land surface models (e.g. code enhancements, model coupling, integration of new sub-models)

    **Examples of recent papers covering some of these topics:**

    <ul class="job-papers">
      <li>(1), (2): <a href="https://wcd.copernicus.org/articles/6/1723/2025/">Glazer et al. (2025)</a>, <a href="https://rmets.onlinelibrary.wiley.com/doi/10.1002/qj.4837">Saunders et al. (2024)</a>, <a href="https://rmets.onlinelibrary.wiley.com/doi/10.1002/qj.4669">Hall et al. (2024)</a></li>
      <li>(3): <a href="https://rmets.onlinelibrary.wiley.com/doi/10.1002/met.70088">Looschelders et al. (2025)</a>, <a href="https://essd.copernicus.org/articles/17/6507/2025/">Morrison et al. (2025)</a>, <a href="https://journals.ametsoc.org/view/journals/bams/105/10/BAMS-D-23-0030.1.xml">Fenner et al. (2024)</a></li>
      <li>(5): <a href="https://rmets.onlinelibrary.wiley.com/doi/10.1002/gdj3.289">Hertwig et al. (2025)</a></li>
      <li>(6), (7), (8): <a href="https://www.sciencedirect.com/science/article/pii/S0378778824007849">Liu et al. (2024)</a>, <a href="https://www.sciencedirect.com/science/article/pii/S2210670724006358">Xie et al. (2024)</a>, <a href="https://www.sciencedirect.com/science/article/pii/S0360132323006480">Xie et al. (2023)</a></li>
    </ul>

    **How to apply:** if you have one or more of these skills and would like to know more, please contact [Prof Sue Grimmond](/people/#sue-grimmond) at <a href="mailto:c.s.grimmond@reading.ac.uk">c.s.grimmond@reading.ac.uk</a>. Positions could be full-time or part-time and could be at a wide range of levels.

